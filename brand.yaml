# RustBill Brand Configuration
# 所有颜色均派生自 accent。覆盖 colors.* 可单独调整任意色。
# 不填 header/sidebar 则回退到硬编码默认值。

brandName: "RustBill"
tagline: "高性能云计算平台"
accent: "#00d1a7"
siteUrl: "https://rb.monesy.cn"

colors:
  success: "#00d1a7"

logo:
  type: "svg"
  svg: |
    <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="6" fill="#090c10" />
      <path d="M8 22V12L16 8L24 12V22L16 26L8 22Z" stroke="#00d1a7" strokeWidth="1.5" fill="none" />
      <circle cx="16" cy="17" r="3" fill="#00d1a7" />
    </svg>

# ─── 顶栏导航 (不填则用硬编码默认) ───
header:
  nav:
    - i18n: "nav.home"
      href: "/"
    - i18n: "nav.products"
      children:
        - i18n: "nav.catalog"
          href: "/catalog"
    - i18n: "nav.legal"
      children:
        - i18n: "nav.terms"
          href: "/legal/terms"
        - i18n: "nav.privacy"
          href: "/legal/privacy"

# ─── Dashboard 侧边栏导航 ───
sidebar:
  nav:
    - i18n: "nav.overview"
      href: "/dashboard"
      icon: "LayoutDashboard"
    - i18n: "nav.myOrders"
      href: "/dashboard/orders"
      icon: "ShoppingCart"
    - i18n: "nav.myInstances"
      href: "/dashboard/instances"
      icon: "Server"
    - i18n: "nav.myInvoices"
      href: "/dashboard/invoices"
      icon: "FileText"
    - i18n: "nav.myTickets"
      href: "/dashboard/tickets"
      icon: "Ticket"
    - i18n: "nav.myBalance"
      href: "/dashboard/balance"
      icon: "Wallet"
    - i18n: "nav.apiKeys"
      href: "/dashboard/api-keys"
      icon: "Key"
    - i18n: "nav.settings"
      href: "/dashboard/settings"
      icon: "Settings"

# ─── 集群节点 (点阵世界地图) ───
clusters:
  - id: "us-west"
    name: "美国西部"
    lat: 37.0
    lng: -122.0
    zones: 3
    latency: "< 10ms"
  - id: "us-east"
    name: "美国东部"
    lat: 40.7
    lng: -74.0
    zones: 4
    latency: "< 15ms"
  - id: "eu-west"
    name: "欧洲西部"
    lat: 51.5
    lng: -0.1
    zones: 3
    latency: "< 12ms"
  - id: "eu-central"
    name: "欧洲中部"
    lat: 50.1
    lng: 8.7
    zones: 2
    latency: "< 8ms"
  - id: "ap-se"
    name: "亚太东南"
    lat: 1.3
    lng: 103.8
    zones: 3
    latency: "< 5ms"
  - id: "ap-ne"
    name: "亚太东北"
    lat: 35.7
    lng: 139.7
    zones: 2
    latency: "< 8ms"
