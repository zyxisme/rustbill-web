name: Josh Reverse Sync

on:
  workflow_dispatch:

jobs:
  sync:
    name: Sync to monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mirror

      - name: Clone monorepo
        env:
          TOKEN: ${{ secrets.MONOREPO_SYNC_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/zyxisme/rustbill.git mono
          cd mono
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply mirror changes and create PR
        env:
          TOKEN: ${{ secrets.MONOREPO_SYNC_TOKEN }}
          GH_TOKEN: ${{ secrets.MONOREPO_SYNC_TOKEN }}
        run: |
          cd mono

          # Create a branch
          BRANCH="josh-reverse-sync-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          # Remove old web-consumer and copy from mirror
          rm -rf web-consumer
          cp -r "$GITHUB_WORKSPACE/mirror" web-consumer
          rm -rf web-consumer/.git

          # Check if there are actual changes
          if git diff --quiet; then
            echo "No changes to sync"
            exit 0
          fi

          # Commit and push
          git add web-consumer
          git commit -m "chore: sync web-consumer changes from mirror repo"
          git push origin "$BRANCH"

          # Create PR
          gh pr create \
            --repo zyxisme/rustbill \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync web-consumer changes from mirror repo" \
            --body "$(cat <<'EOF'
          ## Summary
          - Automated reverse sync from rustbill-web mirror repo
          - Changes were made in the standalone web-consumer repo

          ## Changes
          Auto-generated by Josh Reverse Sync workflow.
          EOF
          )"
